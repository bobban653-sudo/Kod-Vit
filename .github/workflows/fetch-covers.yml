name: Fetch Spotify covers

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-covers.py"
      - ".github/workflows/fetch-covers.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow requests
      - name: Fetch covers
        run: python scripts/fetch-covers.py
      - name: Upload covers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covers
          path: assets/covers/
          if-no-files-found: warn
