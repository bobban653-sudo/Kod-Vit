name: Fetch Spotify covers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-covers.yml"
      - "scripts/fetch-covers.py"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow requests
      - name: Fetch covers
        run: python scripts/fetch-covers.py
      - name: Upload covers
        uses: actions/upload-artifact@v4
        with:
          name: covers
          path: assets/covers/
      - name: Commit covers if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers assets/covers/manifest.json || true
          if git diff --staged --quiet; then
            echo "No cover changes"
          else
            git commit -m "Add Spotify cover art assets from oEmbed"
            git push
          fi
